[pytest]
# --------------------------------------------------------------------------
# Test discovery
# --------------------------------------------------------------------------
# Run pytest from the `backend/` directory (where this file lives):
#   cd backend && pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --------------------------------------------------------------------------
# Marker registration (also declared programmatically in tests/conftest.py
# via pytest_configure; kept here too so `pytest --markers` and IDE
# integrations that only read ini config still see them).
# --------------------------------------------------------------------------
markers =
    nlp: marks tests that require the en_core_web_sm spaCy model to be installed.
    slow: marks tests that are slow due to model loading or large inputs.

# --------------------------------------------------------------------------
# Output
# --------------------------------------------------------------------------
addopts =
    --strict-markers
    --tb=short
    -ra

# --------------------------------------------------------------------------
# Warnings
# --------------------------------------------------------------------------
# `AnalysisResult` (app/models/analysis_result.py) intentionally emits a
# DeprecationWarning on construction; don't let it fail otherwise-strict CI
# warning filters, since it is a documented, deliberate compatibility shim.
filterwarnings =
    ignore:app\.models\.analysis_result\.AnalysisResult is deprecated.*:DeprecationWarning